<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2e7d32">
<title>Transferencia | Manos Verdes</title>
<style>
:root{--g:#2e7d32;--g2:#43a047;--bg:#f7f4e8;--ink:#203020;--muted:#657065;--line:#dfe7df}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:linear-gradient(180deg,#eef7ed,#fff 55%);color:var(--ink)}
.wrap{max-width:600px;margin:auto;padding:18px 14px 42px}
.hero{background:linear-gradient(135deg,#1b5e20,#43a047);color:#fff;border-radius:24px;padding:28px 22px;box-shadow:0 12px 35px #1b5e2022;text-align:center}
.hero h1{margin:0 0 8px;font-size:30px}.hero p{margin:0;opacity:.94}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;margin-top:16px;box-shadow:0 6px 20px #183d180b;text-align:center}
.label{font-size:14px;color:var(--muted);font-weight:700;margin-bottom:8px}
.alias{font-size:28px;font-weight:900;letter-spacing:.5px;background:#e8f5e9;border:2px dashed #81c784;border-radius:15px;padding:18px 10px;color:#1b5e20;user-select:all}
.message{font-size:20px;font-weight:900;line-height:1.35;margin:22px 0 8px}
.sub{color:var(--muted);line-height:1.5}
button{width:100%;border:0;border-radius:14px;padding:15px;margin-top:14px;font-weight:900;font-size:17px;background:#25d366;color:#fff}
.back{background:#e8f5e9;color:#1b5e20}
</style>
</head>
<body>
<div class="wrap">
<header class="hero">
<h1>🌱 Manos Verdes</h1>
<p>Pago por transferencia</p>
</header>
<section class="card">
<div class="label">ALIAS PARA REALIZAR LA TRANSFERENCIA</div>
<div class="alias">manos.verdes.pagos</div>
<p class="message">📲 Por favor, enviar comprobante</p>
<p class="sub">Una vez realizada la transferencia, enviá el comprobante por WhatsApp para que podamos confirmar tu pedido.</p>
<button type="button" onclick="sendReceipt()">📲 Enviar comprobante por WhatsApp</button>
<button class="back" type="button" onclick="history.back()">← Volver al pedido</button>
</section>
</div>
<script>
const WHATSAPP="5492214775865";
function sendReceipt(){
  const data=sessionStorage.getItem("manosVerdesTransferDraft");
  let text="🌱 *MANOS VERDES — COMPROBANTE DE TRANSFERENCIA*\n\nPor favor, adjunto el comprobante de la transferencia correspondiente a mi pedido.";
  if(data){
    try{
      const d=JSON.parse(data);
      if(d.name) text+="\n\n👤 Cliente: "+d.name;
      if(d.total) text+="\n💰 Total del pedido: "+d.total;
    }catch(e){}
  }
  window.location.href="https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent(text);
}
</script>
</body>
</html>
