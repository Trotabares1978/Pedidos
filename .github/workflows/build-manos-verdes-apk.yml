name: Construir APK Manos Verdes Gestión

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - '.github/workflows/build-manos-verdes-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Guardar APK directamente en el repositorio
        run: |
          mkdir -p downloads
          cp app/build/outputs/apk/debug/app-debug.apk downloads/Manos-Verdes-Gestion.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Manos-Verdes-Gestion-APK
          path: downloads/Manos-Verdes-Gestion.apk
          if-no-files-found: error

      - name: Dejar APK descargable directamente
        uses: EndBug/add-and-commit@v9
        with:
          add: 'downloads/Manos-Verdes-Gestion.apk'
          message: 'Publicar APK instalable Manos Verdes Gestión'
          default_author: github_actions
