<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manos Verdes · Gestión</title><style>body{font-family:system-ui;margin:0;background:#f3f7f1;color:#18351f}header{background:#185c2a;color:white;padding:20px}main{max-width:1000px;margin:auto;padding:16px}.card{background:white;padding:18px;border-radius:16px;margin:14px 0;box-shadow:0 3px 12px #0001}input,button{padding:11px;margin:4px;border-radius:10px}button{background:#185c2a;color:white;border:0;font-weight:bold}</style></head><body><header><h1>🌱 Manos Verdes · Gestión</h1></header><main><div id="login" class="card"><h2>Acceso privado</h2><input id="email" type="email" placeholder="Correo"><br><input id="password" type="password" placeholder="Contraseña"><br><button onclick="login()">Ingresar</button><p id="msg"></p></div><div id="panel" class="card" hidden><h2>Panel de administración</h2><p>Acceso correcto. Panel conectado.</p><button onclick="logout()">Cerrar sesión</button></div></main><script>const URL="https://blnoenkmshrybsqpsvtx.supabase.co",KEY="sb_publishable_OmZ_iwMzQNUDeyTJXOjBqw_au5UgLN8";async function login(){let r=await fetch(URL+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify({email:email.value,password:password.value})});if(!r.ok){msg.textContent="Datos incorrectos.";return}let s=await r.json();localStorage.setItem("mv_access",s.access_token);show()}function show(){loginBox.hidden=true;panel.hidden=false}function logout(){localStorage.removeItem("mv_access");location.reload()}const loginBox=document.getElementById("login");if(localStorage.getItem("mv_access"))show()</script></body></html>
