<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manos Verdes · Gestión</title><style>body{font-family:system-ui;margin:0;background:#f3f7f1;color:#18351f}header{background:#185c2a;color:white;padding:20px}main{max-width:1100px;margin:auto;padding:16px}.card{background:white;padding:18px;border-radius:16px;margin:14px 0;box-shadow:0 3px 12px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.stat{font-size:26px;font-weight:800}input,button{padding:11px;margin:4px;border-radius:10px}button{background:#185c2a;color:white;border:0;font-weight:bold}.danger{background:#b3261e}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left;vertical-align:top}a{color:#176b35;font-weight:bold}</style></head><body><header><h1>🌱 Manos Verdes · Gestión</h1></header><main><div id="login" class="card"><h2>Acceso privado</h2><input id="email" type="email" placeholder="Correo"><br><input id="password" type="password" placeholder="Contraseña"><br><label><input id="remember" type="checkbox"> Mantener sesión iniciada</label><br><button onclick="doLogin()">Ingresar</button><p id="msg"></p></div><div id="panel" hidden><div class="card"><button onclick="logout()">Cerrar sesión</button><h2 id="reparto">Reparto semanal</h2><button onclick="cerrar()">Cerrar reparto semanal</button></div><div class="grid"><div class="card">Pedidos<div id="cantidad" class="stat">0</div></div><div class="card">Total<div id="total" class="stat">$0</div></div></div><div class="card"><h2>🥬 Preparación</h2><div id="stock">Cargando...</div></div><div class="card"><h2>📋 Pedidos</h2><div id="pedidos">Cargando...</div></div></div></main><script>const URL="https://blnoenkmshrybsqpsvtx.supabase.co",KEY="sb_publishable_OmZ_iwMzQNUDeyTJXOjBqw_au5UgLN8";function H(){return{apikey:KEY,Authorization:"Bearer "+token(),"Content-Type":"application/json"}}async function doLogin(){const em=document.getElementById("email").value.trim();const pw=document.getElementById("password").value;const status=document.getElementById("msg");status.textContent="Ingresando…";let r=await fetch(URL+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify({email:em,password:pw})});if(!r.ok){let e=await r.text();status.textContent="No se pudo iniciar sesión: "+e;return}let s=await r.json();if(document.getElementById("remember").checked){localStorage.setItem("mv_access",s.access_token);sessionStorage.removeItem("mv_access")}else{sessionStorage.setItem("mv_access",s.access_token);localStorage.removeItem("mv_access")}try{await show()}catch(e){status.textContent="La sesión fue aceptada, pero Gestión encontró un error: "+e.message}}function token(){return localStorage.getItem("mv_access")||sessionStorage.getItem("mv_access")}function logout(){localStorage.removeItem("mv_access");sessionStorage.removeItem("mv_access");location.reload()}function money(n){return"$"+Number(n||0).toLocaleString("es-AR")}function esc(x){return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}async function show(){login.hidden=true;panel.hidden=false;let r=await fetch(URL+"/rest/v1/repartos?select=*&is_open=eq.true&order=delivery_date.asc&limit=1",{headers:H()});let a=await r.json();if(!a.length){reparto.textContent="No hay reparto abierto";cantidad.textContent=0;total.textContent="$0";stock.textContent="Sin reparto abierto.";pedidos.textContent="No hay pedidos.";return}let rep=a[0];reparto.textContent="Reparto del sábado "+new Date(rep.delivery_date+"T12:00:00").toLocaleDateString("es-AR");let q=await fetch(URL+"/rest/v1/pedidos?select=*&reparto_id=eq."+rep.id+"&order=created_at.desc",{headers:H()});let os=await q.json();cantidad.textContent=os.length;total.textContent=money(os.reduce((s,o)=>s+Number(o.total),0));let st={};const add=(n,q)=>st[n]=(st[n]||0)+q;os.forEach(o=>{let x=typeof o.items==="string"?JSON.parse(o.items):o.items;Object.entries(x||{}).forEach(([k,v])=>{let q=Number(v)||0;if(k==="Promo 1-2-Fruta"){add("Bolsón n°1",q);add("Bolsón n°2",q);add("Bolsón de frutas",q)}else if(k==="Promo Los 3 de verdura"){add("Bolsón n°1",q);add("Bolsón n°2",q);add("Bolsón n°3",q)}else if(k==="Promo Los 4 bolsones"){add("Bolsón n°1",q);add("Bolsón n°2",q);add("Bolsón n°3",q);add("Bolsón de frutas",q)}else add(k,q)})});stock.innerHTML=Object.entries(st).map(([k,v])=>"<div><b>"+esc(k)+"</b>: "+v+"</div>").join("")||"Sin pedidos.";pedidos.innerHTML=os.length?"<table><tr><th>Cliente</th><th>Dirección</th><th>WhatsApp</th><th>Productos</th><th>Pago</th><th>Total</th><th>Acción</th></tr>"+os.map(o=>{let x=typeof o.items==="string"?JSON.parse(o.items):o.items;let d=String(o.phone||"").replace(/\D/g,"");if(!d.startsWith("54"))d="54"+d.replace(/^0/,"").replace(/^15/,"");return "<tr><td>"+esc(o.customer_name)+"</td><td>"+esc(o.address)+"</td><td><a target='_blank' href='https://wa.me/"+d+"'>"+esc(o.phone)+"</a></td><td>"+Object.entries(x||{}).map(([k,v])=>esc(k)+" × "+v).join("<br>")+"</td><td>"+esc(o.payment_method)+"</td><td><b>"+money(o.total)+"</b></td><td><button class="danger" onclick="eliminarPedido(\""+o.id+"\")">❌</button></td></tr>"}).join("")+"</table>":"No hay pedidos."}async function cerrar(){if(!confirm("¿Cerrar el reparto semanal?"))return;let r=await fetch(URL+"/rest/v1/repartos?is_open=eq.true",{method:"PATCH",headers:{...H(),"Prefer":"return=minimal"},body:JSON.stringify({is_open:false,closed_at:new Date().toISOString()})});if(!r.ok){alert("No se pudo cerrar: "+await r.text());return}location.reload()}async function validarSesion(){let t=token();if(!t)return;try{let r=await fetch(URL+"/auth/v1/user",{headers:{apikey:KEY,Authorization:"Bearer "+t},cache:"no-store"});if(r.ok){show();return}}catch(e){}localStorage.removeItem("mv_access")}async function eliminarPedido(id){if(!confirm("¿Eliminar este pedido? Esta acción no se puede deshacer."))return;let r=await fetch(URL+"/rest/v1/pedidos?id=eq."+encodeURIComponent(id),{method:"DELETE",headers:{...H(),"Prefer":"return=minimal"}});if(!r.ok){alert("No se pudo eliminar el pedido: "+await r.text());return}show()}</script></body></html>
