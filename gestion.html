<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manos Verdes · Gestión</title><style>body{font-family:system-ui;margin:0;background:#f3f7f1;color:#18351f}header{background:#185c2a;color:white;padding:20px}main{max-width:1100px;margin:auto;padding:16px}.card{background:white;padding:18px;border-radius:16px;margin:14px 0;box-shadow:0 3px 12px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.stat{font-size:26px;font-weight:800}input,button{padding:11px;margin:4px;border-radius:10px}button{background:#185c2a;color:white;border:0;font-weight:bold}.danger{background:#b3261e}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left;vertical-align:top}a{color:#176b35;font-weight:bold}</style></head><body><header><h1>🌱 Manos Verdes · Gestión</h1></header><main><div id="login" class="card"><h2>Acceso privado</h2><input id="email" type="email" placeholder="Correo"><br><input id="password" type="password" placeholder="Contraseña"><br><label><input id="remember" type="checkbox"> Mantener sesión iniciada</label><br><button type="button" id="loginButton">Ingresar</button><p id="msg"></p></div><div id="panel" hidden><div class="card"><button onclick="logout()">Cerrar sesión</button><h2 id="reparto">Reparto semanal</h2><button onclick="cerrar()">Cerrar reparto semanal</button></div><div class="grid"><div class="card">Pedidos<div id="cantidad" class="stat">0</div></div><div class="card">Total<div id="total" class="stat">$0</div></div></div><div class="card"><h2>🥬 Preparación</h2><div id="stock">Cargando...</div></div><div class="card"><h2>📋 Pedidos</h2><div id="pedidos">Cargando...</div></div></div></main><script>
const URL="https://blnoenkmshrybsqpsvtx.supabase.co";
const KEY="sb_publishable_OmZ_iwMzQNUDeyTJXOjBqw_au5UgLN8";
const $=id=>document.getElementById(id);
function token(){return localStorage.getItem("mv_access")||sessionStorage.getItem("mv_access")}
function H(){return{apikey:KEY,Authorization:"Bearer "+token(),"Content-Type":"application/json"}}
function money(n){return "$"+Number(n||0).toLocaleString("es-AR")}
function esc(x){return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
async function doLogin(){
 const status=$("msg"); status.textContent="Ingresando…";
 try{
  const r=await fetch(URL+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify({email:$("email").value.trim(),password:$("password").value})});
  if(!r.ok){status.textContent="No se pudo iniciar sesión: "+await r.text();return}
  const s=await r.json();
  if($("remember").checked){localStorage.setItem("mv_access",s.access_token);sessionStorage.removeItem("mv_access")}
  else{sessionStorage.setItem("mv_access",s.access_token);localStorage.removeItem("mv_access")}
  await show();
 }catch(e){status.textContent="Error de conexión: "+e.message}
}
function logout(){localStorage.removeItem("mv_access");sessionStorage.removeItem("mv_access");location.reload()}
function promoStock(st,n,q){
 const add=(k,v)=>st[k]=(st[k]||0)+v;
 if(n==="Promo 1-2-Fruta"){add("Bolsón n°1",q);add("Bolsón n°2",q);add("Bolsón de frutas",q)}
 else if(n==="Promo Los 3 de verdura"){add("Bolsón n°1",q);add("Bolsón n°2",q);add("Bolsón n°3",q)}
 else if(n==="Promo Los 4 bolsones"){add("Bolsón n°1",q);add("Bolsón n°2",q);add("Bolsón n°3",q);add("Bolsón de frutas",q)}
 else add(n,q)
}
async function show(){
 $("login").hidden=true;$("panel").hidden=false;
 const r=await fetch(URL+"/rest/v1/repartos?select=*&is_open=eq.true&order=delivery_date.asc&limit=1",{headers:H()});
 if(!r.ok)throw Error("No se pudo consultar el reparto: "+await r.text());
 const a=await r.json();
 if(!a.length){$("reparto").textContent="No hay reparto abierto";$("cantidad").textContent="0";$("total").textContent="$0";$("stock").textContent="Sin reparto abierto.";$("pedidos").textContent="No hay pedidos.";return}
 const rep=a[0];
 $("reparto").textContent="Reparto del sábado "+new Date(rep.delivery_date+"T12:00:00").toLocaleDateString("es-AR");
 const q=await fetch(URL+"/rest/v1/pedidos?select=*&reparto_id=eq."+rep.id+"&order=created_at.desc",{headers:H()});
 if(!q.ok)throw Error("No se pudieron cargar los pedidos: "+await q.text());
 const os=await q.json();
 $("cantidad").textContent=os.length;$("total").textContent=money(os.reduce((s,o)=>s+Number(o.total||0),0));
 const st={};
 os.forEach(o=>{const x=typeof o.items==="string"?JSON.parse(o.items):o.items;Object.entries(x||{}).forEach(([k,v])=>promoStock(st,k,Number(v)||0))});
 $("stock").innerHTML=Object.entries(st).map(([k,v])=>"<div class='card' style='display:inline-block;min-width:150px;margin:5px'><b>"+esc(k)+"</b><div class='stat'>"+v+"</div></div>").join("")||"Sin pedidos.";
 $("pedidos").innerHTML=os.length?os.map(o=>{
  const x=typeof o.items==="string"?JSON.parse(o.items):o.items;
  let d=String(o.phone||"").replace(/\D/g,"");if(!d.startsWith("54"))d="54"+d.replace(/^0/,"").replace(/^15/,"");
  return "<div class='card'><h3>"+esc(o.customer_name)+"</h3><div>📍 "+esc(o.address)+"</div><div>📲 <a target='_blank' href='https://wa.me/"+d+"'>"+esc(o.phone)+"</a></div><div style='margin:10px 0'>"+Object.entries(x||{}).map(([k,v])=>"<div>"+esc(k)+" × "+v+"</div>").join("")+"</div><div>💳 "+esc(o.payment_method)+"</div><h3>"+money(o.total)+"</h3><button class='danger' onclick='eliminarPedido(""+o.id+"")'>❌ Eliminar pedido</button></div>"
 }).join(""):"No hay pedidos.";
}
async function cerrar(){
 if(!confirm("¿Cerrar el reparto semanal?"))return;
 const r=await fetch(URL+"/rest/v1/repartos?is_open=eq.true",{method:"PATCH",headers:{...H(),"Prefer":"return=minimal"},body:JSON.stringify({is_open:false,closed_at:new Date().toISOString()})});
 if(!r.ok){alert("No se pudo cerrar: "+await r.text());return}
 location.reload();
}
async function eliminarPedido(id){
 if(!confirm("¿Eliminar este pedido? Esta acción no se puede deshacer."))return;
 const r=await fetch(URL+"/rest/v1/pedidos?id=eq."+encodeURIComponent(id),{method:"DELETE",headers:{...H(),"Prefer":"return=minimal"}});
 if(!r.ok){alert("No se pudo eliminar el pedido: "+await r.text());return}
 await show();
}
async function validarSesion(){
 const t=token();if(!t)return;
 try{const r=await fetch(URL+"/auth/v1/user",{headers:{apikey:KEY,Authorization:"Bearer "+t},cache:"no-store"});if(r.ok){await show();return}}catch(e){}
 localStorage.removeItem("mv_access");sessionStorage.removeItem("mv_access");
}
document.addEventListener("DOMContentLoaded",()=>{
 $("loginButton").addEventListener("click",doLogin);
 $("password").addEventListener("keydown",e=>{if(e.key==="Enter")doLogin()});
 validarSesion();
});
</script></body></html>
